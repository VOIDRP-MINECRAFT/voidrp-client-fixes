plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.21'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // brewinandchewin is targeted by string in the mixin (remap=false), so it is NOT needed
    // on the compile classpath. Kept commented for reference.
    // compileOnly files('../minecraft_server/mods/brewinandchewin-neoforge-4.5.01.21.1.jar')
    // Jade IS needed on the compile classpath: JadeUnregisteredBlockGuardMixin injects into
    // ClientProxy.requestBlockData, whose descriptor references snownee.jade.api.BlockAccessor,
    // so the injector's parameter types must be the real ones. compileOnly — never shipped.
    compileOnly files('libs/Jade-1.21.1-NeoForge-15.10.5.jar')
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        mod_issue_tracker_url  : mod_issue_tracker_url,
        mod_display_url        : mod_display_url
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version
        ])
    }
}
